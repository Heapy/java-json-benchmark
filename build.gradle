plugins {
    id 'java'
    id 'application'
    id 'org.jetbrains.kotlin.jvm' version '2.4.10'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.4.10'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'com.github.ben-manes.versions' version '0.49.0'
}

group = 'com.github.fabienrenaud'
version = '8'

application {
    mainClass = 'com.github.fabienrenaud.jjb.Cli'
}

java {
    toolchain {
        sourceCompatibility = 25
        targetCompatibility = 25
    }
}

kotlin {
    jvmToolchain(25)
}

repositories {
    mavenLocal()
    mavenCentral()
}

ext {
    avajeJsonVersion = '1.11'
    jacksonVersion = '2.17.1'
    dslJsonVersion = '2.0.2'
    johnzonVersion = '2.0.1'
    jmhVersion = '1.35'
    kotlinxSerializationVersion = '1.11.0'
}

dependencies {

    // CLI and misc
    implementation 'io.airlift:airline:0.9'
    implementation 'org.apache.commons:commons-lang3:3.12.0'

    // JSON libraries
    // In alphabetical order.

    // antons
    implementation 'io.github.antonsjava:json:1.17'
    // avaje-jsonb
    implementation "io.avaje:avaje-jsonb:${avajeJsonVersion}"
    implementation "io.avaje:avaje-jsonb-jackson:${avajeJsonVersion}"
    annotationProcessor "io.avaje:avaje-jsonb-generator:${avajeJsonVersion}"   
    // boon
    implementation 'io.fastjson:boon:0.34'
    // DSL-json
    implementation "com.dslplatform:dsl-json:${dslJsonVersion}"
    annotationProcessor "com.dslplatform:dsl-json:${dslJsonVersion}"
    // FastJson
    implementation 'com.alibaba.fastjson2:fastjson2:2.0.57'
    // FlexJson
    implementation 'net.sf.flexjson:flexjson:3.3'
    // Fory JSON
    implementation 'org.apache.fory:fory-json:1.6.0'
    // GENSON
    implementation 'com.owlike:genson:1.6'
    // GSON
    implementation 'com.google.code.gson:gson:2.11.0'
    // Jackson
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-afterburner:${jacksonVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-blackbird:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    // jodd
    implementation 'org.jodd:jodd-json:6.0.3'
    // johnzon
    implementation "org.apache.johnzon:johnzon-core:${johnzonVersion}"
    implementation "org.apache.johnzon:johnzon-mapper:${johnzonVersion}"
    // Jakarta
    implementation 'jakarta.json.bind:jakarta.json.bind-api:3.0.1'
    implementation 'jakarta.json:jakarta.json-api:2.1.3'
    implementation 'org.glassfish:jakarta.json:2.0.1'
    // json-io
    implementation 'com.cedarsoftware:json-io:4.102.0'
    // json-simple
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    // json-smart
    implementation 'net.minidev:json-smart:2.5.1'
    // kotlinx.serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinxSerializationVersion}"
    // LoganSquare
    implementation 'com.bluelinelabs:logansquare:1.3.7'
    annotationProcessor 'com.bluelinelabs:logansquare-compiler:1.3.7'
    // minimal-json
    implementation 'com.eclipsesource.minimal-json:minimal-json:0.9.5'
    // mjson
    implementation 'org.sharegov:mjson:1.4.1'
    // moshi
    implementation 'com.squareup.moshi:moshi:1.15.1'
    // nanojson
    implementation 'com.grack:nanojson:1.9'
    // org.json
    implementation 'org.json:json:20240303'
    // purejson
    implementation 'io.github.senthilganeshs:purejson:1.0.1'
    // qson
    implementation 'io.quarkus.qson:qson-generator:1.1.1.Final'
    // tapestry
    implementation 'org.apache.tapestry:tapestry-json:5.8.6'
    // underscore-java
    implementation 'com.github.javadev:underscore:1.101'
    // yasson
    implementation 'org.eclipse:yasson:3.0.3'
    // QuickBuffers
    implementation 'us.hebi.quickbuf:quickbuf-runtime:1.4'
    // wast
    implementation 'io.github.wycst:wast:0.0.29.1'
    // djomo
    implementation 'com.bigcloud.djomo:djomo:0.9.4'

    // Test
    testImplementation 'junit:junit:4.13.2'

    // IMPORTANT: Leave JMH at the end!
    // JMH
    implementation "org.openjdk.jmh:jmh-core:${jmhVersion}"
    annotationProcessor "org.openjdk.jmh:jmh-generator-annprocess:${jmhVersion}"
}

// Cold-JVM measurements live outside the main source set so a child process
// cannot initialize JsonBench, JsonSource, or the eager all-library providers.
sourceSets {
    coldBenchmark {
        java.srcDir 'src/coldBenchmark/java'
        kotlin.srcDir 'src/coldBenchmark/kotlin'
    }
}

configurations {
    coldBenchmarkCommonRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
    coldBenchmarkJacksonRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom coldBenchmarkCommonRuntime
    }
    coldBenchmarkGsonRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom coldBenchmarkCommonRuntime
    }
    coldBenchmarkKotlinxRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom coldBenchmarkCommonRuntime
    }
    coldBenchmarkForyRuntime {
        canBeConsumed = false
        canBeResolved = true
        extendsFrom coldBenchmarkCommonRuntime
    }
}

dependencies {
    // Compilation sees all adapters; every measured child gets only its selected
    // library plus the common DTO/runtime classpath.
    coldBenchmarkImplementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
    coldBenchmarkImplementation "org.jetbrains.kotlinx:kotlinx-serialization-json:${kotlinxSerializationVersion}"
    coldBenchmarkImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    coldBenchmarkImplementation 'com.google.code.gson:gson:2.11.0'
    coldBenchmarkImplementation 'org.apache.fory:fory-json:1.6.0'

    coldBenchmarkCommonRuntime 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
    coldBenchmarkCommonRuntime "org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:${kotlinxSerializationVersion}"
    coldBenchmarkJacksonRuntime "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    coldBenchmarkGsonRuntime 'com.google.code.gson:gson:2.11.0'
    coldBenchmarkKotlinxRuntime "org.jetbrains.kotlinx:kotlinx-serialization-json-jvm:${kotlinxSerializationVersion}"
    coldBenchmarkForyRuntime 'org.apache.fory:fory-json:1.6.0'

    testImplementation sourceSets.coldBenchmark.output
}

tasks.register('coldBenchmarkJar', Jar) {
    dependsOn tasks.named('coldBenchmarkClasses')
    archiveFileName = 'cold-benchmark-harness.jar'
    destinationDirectory = layout.buildDirectory.dir('cold-benchmark')
    from sourceSets.coldBenchmark.output
    manifest {
        attributes 'Main-Class': 'com.github.fabienrenaud.jjb.cold.ColdBenchmarkMain'
    }
}

// Keep the child classpath stable across Gradle cache layouts. Its order is
// captured in metadata because it is part of the cold-start environment.
def coldBenchmarkArtifactOrder = [
    jackson: ['jackson-annotations-', 'jackson-core-', 'jackson-databind-',
              'kotlin-stdlib-', 'kotlinx-serialization-core-', 'annotations-'],
    gson: ['gson-', 'error_prone_annotations-', 'kotlin-stdlib-',
           'kotlinx-serialization-core-', 'annotations-'],
    kotlinx: ['kotlin-stdlib-', 'kotlinx-serialization-core-',
              'kotlinx-serialization-json-', 'annotations-'],
    fory: ['fory-core-', 'fory-json-', 'commons-compiler-', 'janino-',
           'kotlin-stdlib-', 'kotlinx-serialization-core-', 'annotations-'],
]

def orderedColdBenchmarkFiles = { library, files ->
    def prefixes = coldBenchmarkArtifactOrder[library]
    files.sort { left, right ->
        def leftIndex = prefixes.findIndexOf { left.name.startsWith(it) }
        def rightIndex = prefixes.findIndexOf { right.name.startsWith(it) }
        leftIndex = leftIndex < 0 ? prefixes.size() : leftIndex
        rightIndex = rightIndex < 0 ? prefixes.size() : rightIndex
        leftIndex == rightIndex ? left.name <=> right.name : leftIndex <=> rightIndex
    }
}

def coldBenchmarkClasspathFiles = {
    def harnessJar = tasks.named('coldBenchmarkJar').get().archiveFile.get().asFile
    [
        jackson: [harnessJar] + orderedColdBenchmarkFiles(
            'jackson', configurations.coldBenchmarkJacksonRuntime.files
        ),
        gson: [harnessJar] + orderedColdBenchmarkFiles(
            'gson', configurations.coldBenchmarkGsonRuntime.files
        ),
        kotlinx: [harnessJar] + orderedColdBenchmarkFiles(
            'kotlinx', configurations.coldBenchmarkKotlinxRuntime.files
        ),
        fory: [harnessJar] + orderedColdBenchmarkFiles(
            'fory', configurations.coldBenchmarkForyRuntime.files
        ),
    ]
}

def coldBenchmarkChildRuntime = files({
    coldBenchmarkClasspathFiles().values().flatten()
})

def coldBenchmarkLibDirectory = layout.buildDirectory.dir('cold-benchmark/lib')

tasks.register('prepareColdBenchmark', Sync) {
    dependsOn tasks.named('coldBenchmarkJar')
    into coldBenchmarkLibDirectory
    from coldBenchmarkChildRuntime

    doLast {
        def classpathFiles = coldBenchmarkClasspathFiles()
        def collisions = classpathFiles.values().flatten()
            .groupBy { it.name }
            .findAll { name, files -> files.collect { it.canonicalPath }.unique().size() > 1 }
        if (!collisions.isEmpty()) {
            throw new GradleException("Cold benchmark has duplicate jar basenames: ${collisions.keySet()}")
        }

        def target = coldBenchmarkLibDirectory.get().file('cold-classpaths.properties').asFile
        target.withWriter('ISO-8859-1') { writer ->
            ['jackson', 'gson', 'kotlinx', 'fory'].each { library ->
                writer.write(library)
                writer.write('=')
                writer.write(classpathFiles[library].collect { it.name }.join(','))
                writer.write(System.lineSeparator())
            }
        }
    }
}

tasks.register('coldBenchmark', JavaExec) {
    dependsOn tasks.named('prepareColdBenchmark')
    group = 'benchmark'
    description = 'Runs randomized cold-JVM JSON samples (30 per cell by default).'
    classpath = files(tasks.named('coldBenchmarkJar').flatMap { it.archiveFile })
    mainClass = 'com.github.fabienrenaud.jjb.cold.ColdBenchmarkMain'
    systemProperty 'coldBenchmark.libDir', coldBenchmarkLibDirectory.get().asFile.absolutePath
    workingDir = projectDir
    if (project.hasProperty('coldArgs')) {
        args org.apache.tools.ant.types.Commandline.translateCommandline(
            project.property('coldArgs').toString()
        )
    }
}

def coldBenchmarkStartScripts = tasks.register(
    'coldBenchmarkStartScripts',
    org.gradle.jvm.application.tasks.CreateStartScripts
) {
    dependsOn tasks.named('coldBenchmarkJar')
    applicationName = 'cold-benchmark'
    mainClass = 'com.github.fabienrenaud.jjb.cold.ColdBenchmarkMain'
    outputDir = layout.buildDirectory.dir('cold-benchmark/scripts').get().asFile
    classpath = files(tasks.named('coldBenchmarkJar').flatMap { it.archiveFile })
}

distributions {
    main {
        contents {
            from(coldBenchmarkStartScripts) {
                into 'bin'
                filePermissions {
                    unix('rwxr-xr-x')
                }
            }
            from(tasks.named('prepareColdBenchmark')) {
                into 'lib'
                duplicatesStrategy = DuplicatesStrategy.EXCLUDE
            }
        }
    }
}

tasks.named('installDist') {
    dependsOn tasks.named('prepareColdBenchmark'), coldBenchmarkStartScripts
}

shadowJar {
    archiveFileName = 'app.jar'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

test {
    dependsOn tasks.named('prepareColdBenchmark')
    systemProperty 'jjb.cold.classpathFile', coldBenchmarkLibDirectory.get()
        .file('cold-classpaths.properties').asFile.absolutePath
    jvmArgs '--add-opens=java.base/java.time=ALL-UNNAMED', '--add-modules=jdk.incubator.vector'
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

task (depsize) {
    doLast {
        def size = 0
        def formatStr = '%,10.2f'
        configurations.default.collect { it.length() / (1024 * 1024) }.each { size += it }

        def out = new StringBuffer()
        out << 'Total dependencies size:'.padRight(45)
        out << "${String.format(formatStr, size)} MiB\n\n"

        configurations
            .default
            .sort { -it.length() }
            .each {
                out << "${it.name}".padRight(45)
                out << "${String.format(formatStr, (it.length() / 1024))} KiB\n"
            }
            println(out)
    }
}
